    const ready = gameState.credits >= gameState.maxCredits;
    gateMarker.visible = ready && !gameState.finished;
    if (gateMarker.visible) gateBeamMat.opacity = .3 + .18 * Math.sin(performance.now() / 280);
    if (gameState.finished || gameState.panelOpen || gameState.inStrangeSpace || document.pointerLockElement !== renderer.domElement) return;
    const d = Math.hypot(camera.position.x - GATE_POS.x, camera.position.z - GATE_POS.z);
    if (d >= 3) return;
    if (ready) {
      if (gateWinInProgress) return;
      gateWinInProgress = true; gameState.panelOpen=true; fadeEl.style.opacity='1';
      setTimeout(() => { winGame(); setTimeout(() => { fadeEl.style.opacity='0'; },350); },500);
    } else {
      const now=performance.now(); if (now-lastGateBlockToast>2500) { lastGateBlockToast=now; showToast('学分不够，门卫老陈把你拦下了'); }
    }
  }
  function update(dt) {
    updateDoors(dt);
    if (gameState.minigameOpen) { updateSchedule(dt); updateTeacher(dt); return; }
    if(gameState.chatOpen){if(currentChat&&Math.hypot(camera.position.x-currentChat.npc.group.position.x,camera.position.z-currentChat.npc.group.position.z)>CONFIG.talkDistance+1.5)closeChat();updateTeacher(dt);return;}
    if(gameState.inStrangeSpace){updateStrangeSpace(dt);const s=4.6*dt;forward.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));move.set(0,0,0);if(keys.has('KeyW'))move.add(forward);if(keys.has('KeyS'))move.sub(forward);if(keys.has('KeyD'))move.add(right);if(keys.has('KeyA'))move.sub(right);if(move.lengthSq()){move.normalize().multiplyScalar(s);camera.position.x+=move.x;camera.position.z+=move.z;}camera.position.x=Math.max(110.6,Math.min(129.4,camera.position.x));camera.position.z=Math.max(-8.4,Math.min(8.4,camera.position.z));updateHUD();return;}
    const speed = 4.6 * dt;
    const prevX = camera.position.x, prevZ = camera.position.z;
    if (collides(prevX, prevZ)) {
      let escaped = false;
      for (let distance = .08; distance <= 1.36 && !escaped; distance += .08) {
        for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const x = prevX + dx * distance, z = prevZ + dz * distance;
          if (!collides(x, z)) {
            camera.position.x = x; camera.position.z = z; escaped = true; break;
          }
        }
      }
      if (!escaped) { camera.position.x = prevX; camera.position.z = prevZ; }
    }
    forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    right.set(Math.cos(yaw), 0, -Math.sin(yaw));
    move.set(0, 0, 0);
    if (keys.has('KeyW')) move.add(forward);
    if (keys.has('KeyS')) move.sub(forward);
    if (keys.has('KeyD')) move.add(right);
    if (keys.has('KeyA')) move.sub(right);
    if (move.lengthSq()) {
      move.normalize().multiplyScalar(speed);
      const steps = Math.ceil(move.length() / .08);
      move.multiplyScalar(1 / steps);
      for (let i = 0; i < steps; i++) {
        const candidateX = camera.position.x + move.x;
        if (!collides(candidateX, camera.position.z)) camera.position.x = candidateX;
        const candidateZ = camera.position.z + move.z;
        if (!collides(camera.position.x, candidateZ)) camera.position.z = candidateZ;
      }
    }
    nearbyDoor = null;
    for (const door of doors) {
      const cx = door.cx, cz = door.cz;
      if (Math.hypot(camera.position.x - cx, camera.position.z - cz) < 2.25) { nearbyDoor = door; break; }
    }
    updateSchedule(dt);
    const period=gameState.schedule[gameState.periodIndex];
    const classKey=period&&period.type==='class'?gameState.day+'-'+gameState.periodIndex:'';
    if(classKey&&classKey!==counselor.periodKey){if(counselor.periodKey!=='')counselor.area=counselor.area==='front'?'back':'front';counselor.periodKey=classKey;counselor.waypoint=0;const startWp=(counselor.area==='front'?counselorWaypoints:counselorBackWaypoints)[0];counselor.group.position.set(startWp[0],0,startWp[1]);}
    counselor.group.visible=!!(period&&period.type==='class');
    if(counselor.group.visible){const wps=counselor.area==='front'?counselorWaypoints:counselorBackWaypoints;let target=wps[counselor.waypoint];let dx=target[0]-counselor.group.position.x,dz=target[1]-counselor.group.position.z,dist=Math.hypot(dx,dz);if(dist<.15){counselor.waypoint=(counselor.waypoint+1)%wps.length;target=wps[counselor.waypoint];dx=target[0]-counselor.group.position.x;dz=target[1]-counselor.group.position.z;dist=Math.hypot(dx,dz);}if(dist>.001){const st=Math.min(dist,CONFIG.counselorSpeed*dt),vx=dx/dist,vz=dz/dist;counselor.group.position.x+=vx*st;counselor.group.position.z+=vz*st;counselor.facing=Math.atan2(vx,vz);counselor.group.rotation.y=counselor.facing;}}
    updateTeacher(dt);
    updateStrangeSpace(dt);
    updateGate();
  }
  let last = performance.now();
  updateHUD();
  scene.traverse(o => { if (!o.isMesh) return; o.receiveShadow = true; const n = o.name || ''; o.castShadow =!(n.includes('ceiling') || n.includes('wall') || n.includes('floor') || n.includes('glass') || n.includes('sign') || n.includes('skyline') || n.includes('cloud')) &&!(o.material && o.material.isMeshBasicMaterial);});
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, .05); last = now;
    update(dt);
    if(saveEnabled&&!gameState.finished&&now-lastSaveCheck>=500){lastSaveCheck=now;try{const snapshot=JSON.stringify(makeSaveSnapshot());if(snapshot!==lastSavedSnapshot)saveGame();}catch(_){}}
    renderer.render(scene, camera);
  }
  animate(last);
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
})();
</script>
