  for (const [x,z] of [[-35.5,105],[-35.5,119],[-50,122.8]]) willow(x,z);
  // 校门与广场南口斑马线。
  for (const z of [121.6,122.4,123.2,124]) box('zebra stripe',0,-.165,z,6.4,.015,.55,0xf5f2ea);
  for (const z of [54.6,55.4,56.2,57]) box('zebra stripe',0,-.105,z,5.6,.015,.55,0xf5f2ea);
  for (const [x,y,z] of [[0,3.05,-2],[-.7,3.05,-18.8],[0,3.05,15],[0,3.05,-12.9],[0,6.65,-12.9],[3.4,6.65,-4]]) { const light=new THREE.PointLight(0xffe6bb,26,12,2); light.castShadow=false; light.position.set(x,y,z); scene.add(light); }
  for (const [x,y,z,length,width] of [[0,3.56,-5,2.4,.5],[0,3.56,1,2.4,.5],[-.7,3.56,-18.8,2.4,.5],[0,3.56,11,2.4,.5],[0,3.56,19,2.4,.5],[-6,3.56,-12.9,1.8,.4],[0,3.56,-12.9,1.8,.4],[6,3.56,-12.9,1.8,.4],[-6,7.16,-12.9,1.8,.4],[0,7.16,-12.9,1.8,.4],[6,7.16,-12.9,1.8,.4],[.4,7.16,-4,2.4,.5],[6.4,7.16,-4,2.4,.5],[77,3.56,39,2.4,.5],[85,3.56,39,2.4,.5],[76,3.56,73,2.4,.5],[81,3.56,73,2.4,.5],[86,3.56,73,2.4,.5]]) { const panel=new THREE.Mesh(new THREE.BoxGeometry(length,.035,width),new THREE.MeshBasicMaterial({color:0xfff3d6})); panel.name='lamp panel'; panel.position.set(x,y,z); scene.add(panel); }
  scene.traverse(o => { if (!o.isMesh) return; o.receiveShadow = true; const n = o.name || ''; o.castShadow =!(n.includes('ceiling') || n.includes('wall') || n.includes('floor') || n.includes('glass') || n.includes('sign') || n.includes('skyline') || n.includes('cloud') || n.includes('lamp')) &&!(o.material && o.material.isMeshBasicMaterial);});
  let camDist=4.5;
  renderer.domElement.addEventListener('wheel',e=>{if(document.pointerLockElement===renderer.domElement)camDist=Math.max(2.5,Math.min(7,camDist+Math.sign(e.deltaY)*.5));},{passive:true});
  function placeCamera(){
    const savedPos=camera.position.clone(),head=new THREE.Vector3(savedPos.x,savedPos.y+.1,savedPos.z);
    const f=new THREE.Vector3(-Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch),-Math.cos(pitch)*Math.cos(yaw));
    const want=head.clone().addScaledVector(f,-camDist),delta=want.clone().sub(head);let limit=1;
    const slab=(lo,hi,o,d)=>{if(Math.abs(d)<1e-8)return o>=lo&&o<=hi?[-Infinity,Infinity]:null;let a=(lo-o)/d,b=(hi-o)/d;return a<b?[a,b]:[b,a];};
    for(const c of colliders){if(c.door)continue;let b=c.bounds;
      if(c.mesh){const q=c.mesh.geometry&&c.mesh.geometry.parameters;if(!q)continue;const m=c.mesh.position;b={minX:m.x-q.width/2,maxX:m.x+q.width/2,minZ:m.z-q.depth/2,maxZ:m.z+q.depth/2};}
      if(!b)continue;let y0=c.y0!==undefined?c.y0:(c.mesh?c.mesh.position.y-(c.mesh.geometry.parameters.height||1)/2:0);let y1=c.y1!==undefined?c.y1:(c.mesh?c.mesh.position.y+(c.mesh.geometry.parameters.height||1)/2:y0+6);if(c.bounds){y0=c.y0<=1?0:3.6;y1=y0+6;}
      if(head.x>=b.minX&&head.x<=b.maxX&&head.y>=y0&&head.y<=y1&&head.z>=b.minZ&&head.z<=b.maxZ)continue;
      const xs=slab(b.minX,b.maxX,head.x,delta.x),ys=slab(y0,y1,head.y,delta.y),zs=slab(b.minZ,b.maxZ,head.z,delta.z);if(!xs||!ys||!zs)continue;const en=Math.max(xs[0],ys[0],zs[0]),ex=Math.min(xs[1],ys[1],zs[1]);if(en<=ex&&ex>=0&&en<=limit&&en>=0)limit=Math.max(0,en-.25/Math.max(delta.length(),.001));
    }
    let pos=head.clone().addScaledVector(delta,limit);const hs=surfaceHeightsAt(want.x,want.z),fl=hs.filter(h=>h<=want.y+.65).reduce((a,h)=>Math.max(a,h),0);pos.y=Math.max(pos.y,fl+.3);camera.position.copy(pos);camera.lookAt(head.x,head.y+.05,head.z);return savedPos;
  }
  // ===== 画质第5步：后期处理（手写管线：泛光+暗角+胶片颗粒+暖调分级；按P键切换档位，帧率低自动降级） =====
  const postFX = { level: 2, auto: true, ema: 60, lowT: 0, highT: 0, lastT: 0, msaa: 4, stage: 'full' };
  window.__postFX = postFX; window.__renderer = renderer;
  const fsCam = new THREE.Camera();
  const fsScene = new THREE.Scene();
  const fsMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
  fsMesh.frustumCulled = false; fsScene.add(fsMesh);
  const FS_VERT = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  function fsMat(frag, uniforms) { return new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false }); }
  const matBright = fsMat('uniform sampler2D tSrc;uniform float uTh;varying vec2 vUv;void main(){vec3 c=texture2D(tSrc,vUv).rgb;float l=dot(c,vec3(.2126,.7152,.0722));float k=smoothstep(uTh,uTh+.35,l);gl_FragColor=vec4(c*k,1.);}', { tSrc: { value: null }, uTh: { value: .72 } });
  const matBlur = fsMat('uniform sampler2D tSrc;uniform vec2 uDir;varying vec2 vUv;void main(){vec3 s=texture2D(tSrc,vUv).rgb*.227027;vec2 a=uDir*1.3846153;vec2 b=uDir*3.2307692;s+=texture2D(tSrc,vUv+a).rgb*.3162162;s+=texture2D(tSrc,vUv-a).rgb*.3162162;s+=texture2D(tSrc,vUv+b).rgb*.0702703;s+=texture2D(tSrc,vUv-b).rgb*.0702703;gl_FragColor=vec4(s,1.);}', { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } });
  const matComp = fsMat('uniform sampler2D tSrc;uniform sampler2D tBloom;uniform float uBloom;uniform float uTime;uniform float uSceneMix;varying vec2 vUv;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}void main(){vec3 c=texture2D(tSrc,vUv).rgb*uSceneMix;c+=texture2D(tBloom,vUv).rgb*uBloom;c=mix(c,c*vec3(1.04,1.,.96),.5);vec2 d=vUv-.5;float vig=smoothstep(.95,.45,dot(d,d)*1.6);c*=mix(1.,vig,.32);c+=(hash(vUv*vec2(1920.,1080.)+fract(uTime)*7.13)-.5)*.028;gl_FragColor=vec4(c,1.);\n#include <colorspace_fragment>\n}', { tSrc: { value: null }, tBloom: { value: null }, uBloom: { value: .55 }, uTime: { value: 0 }, uSceneMix: { value: 1 } });
  let rtScene = null, rtA = null, rtB = null;
  function buildRTs(w, h) {
    if (rtScene) { rtScene.dispose(); rtA.dispose(); rtB.dispose(); }
    rtScene = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    rtScene.samples = postFX.msaa;
    const bw = Math.max(2, w >> 1), bh = Math.max(2, h >> 1);
    rtA = new THREE.WebGLRenderTarget(bw, bh, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
    rtB = rtA.clone();
  }
  function fsPass(mat, target) { fsMesh.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }
  function renderFrame(now) {
    if (postFX.lastT) { const inst = 1000 / Math.max(1, now - postFX.lastT); postFX.ema += (inst - postFX.ema) * .05; }
    postFX.lastT = now;
    if (postFX.auto) {
      if (postFX.level > 0 && postFX.ema < 42) { postFX.lowT++; postFX.highT = 0; if (postFX.lowT > 150) { postFX.level--; postFX.lowT = 0; } }
      else if (postFX.level < 2 && postFX.ema > 57) { postFX.highT++; postFX.lowT = 0; if (postFX.highT > 600) { postFX.level++; postFX.highT = 0; } }
      else { postFX.lowT = 0; if (postFX.ema <= 57) postFX.highT = 0; }
    }
    if (postFX.level === 0) { renderer.render(scene, camera); return; }
    const size = renderer.getDrawingBufferSize(new THREE.Vector2());
    if (!rtScene || rtScene.width !== size.x || rtScene.height !== size.y) buildRTs(size.x, size.y);
    renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
    if (postFX.stage === 'scene') {
      matComp.uniforms.tSrc.value = rtScene.texture; matComp.uniforms.tBloom.value = rtScene.texture;
      matComp.uniforms.uBloom.value = 0; matComp.uniforms.uSceneMix.value = 1; matComp.uniforms.uTime.value = now / 1000;
      fsPass(matComp, null); renderer.setRenderTarget(null); return;
    }
    matBright.uniforms.tSrc.value = rtScene.texture; fsPass(matBright, rtA);
    const texel = new THREE.Vector2(1 / rtA.width, 1 / rtA.height);
    const iters = postFX.level === 2 ? 2 : 1;
    for (let i = 0; i < iters; i++) {
      matBlur.uniforms.tSrc.value = rtA.texture; matBlur.uniforms.uDir.value.set(texel.x, 0); fsPass(matBlur, rtB);
      matBlur.uniforms.tSrc.value = rtB.texture; matBlur.uniforms.uDir.value.set(0, texel.y); fsPass(matBlur, rtA);
    }
    matComp.uniforms.tSrc.value = rtScene.texture; matComp.uniforms.tBloom.value = rtA.texture;
    matComp.uniforms.uBloom.value = postFX.level === 2 ? .55 : .4;
    matComp.uniforms.uSceneMix.value = postFX.stage === 'bloom' ? 0 : 1;
    matComp.uniforms.uTime.value = now / 1000;
    fsPass(matComp, null);
    renderer.setRenderTarget(null);
  }
  window.addEventListener('keydown', (e) => { if (e.code === 'KeyP') { postFX.level = (postFX.level + 2) % 3; postFX.auto = false; } });
  const Q = new URLSearchParams(location.search);
  if (Q.get('fx') === '0') { postFX.level = 0; postFX.auto = false; }
  if (Q.get('fx') === '1') { postFX.level = 1; postFX.auto = false; }
  if (Q.get('stage')) postFX.stage = Q.get('stage');
  if (Q.get('msaa') === '0') postFX.msaa = 0;
  if (Q.get('naked') === '1') { document.getElementById('overlay').style.display = 'none'; }
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, .05); last = now;
    update(dt);
    updatePlayerAvatar(dt);
    if(saveEnabled&&!gameState.finished&&now-lastSaveCheck>=500){lastSaveCheck=now;try{const snapshot=JSON.stringify(makeSaveSnapshot());if(snapshot!==lastSavedSnapshot)saveGame();}catch(_){}}
    camera.rotation.set(pitch,yaw,0,'YXZ');
    renderFrame(now);
  }
  animate(last);
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
})();
